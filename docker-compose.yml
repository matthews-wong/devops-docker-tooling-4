services:
  status-page:
    build:
      context: .
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        BUILD_DATE: ${BUILD_DATE:-}
    image: status-page:local
    init: true
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/cache/nginx:size=16m
      - /var/run:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
